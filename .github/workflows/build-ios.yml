name: iOS Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Widget/**'
      - 'Shared/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for generic iOS device (unsigned)
        run: |
          xcodebuild -project MyTokens.xcodeproj -scheme MyTokens -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Upload unsigned build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mytokens-build-logs
          path: build/Logs/
          if-no-files-found: ignore
